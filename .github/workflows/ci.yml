name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install memQrag with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pytest
        run: pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` requires package-lock.json to be perfectly in sync, which is
      # currently unreliable for this project: Vite 8's Rolldown bundler and
      # Tailwind's Oxide engine ship platform-specific optional native
      # binaries (e.g. @emnapi/core, @emnapi/runtime) that npm has not
      # consistently pinned into the lockfile across platforms. See
      # docs/DECISIONS.md ("CI And Local Check Scripts").
      - name: Install dependencies
        run: npm install

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite build)
        run: npm run build
